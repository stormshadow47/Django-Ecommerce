apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: django-ecommerce-network-policy
  labels:
    app: django-ecommerce
spec:
  podSelector:
    matchLabels:
      app: django-ecommerce
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: django-ecommerce
    ports:
    - protocol: TCP
      port: 8000
  - from:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 8000
  egress:
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 53
    - protocol: UDP
      port: 53
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 443
  - to:
    - podSelector:
        matchLabels:
          app: django-ecommerce
    ports:
    - protocol: TCP
      port: 8000
