apiVersion: v1
kind: ServiceAccount
metadata:
  name: django-ecommerce-sa
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: django-ecommerce-role
  namespace: default
rules:
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: ["django-secrets"]
  verbs: ["get"]
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: django-ecommerce-rolebinding
  namespace: default
subjects:
- kind: ServiceAccount
  name: django-ecommerce-sa
  namespace: default
roleRef:
  kind: Role
  name: django-ecommerce-role
  apiGroup: rbac.authorization.k8s.io
