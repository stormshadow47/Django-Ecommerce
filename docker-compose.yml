version: '3.8'

services:
  web:
    build: .
    image: nithin058/django-ecommerce:latest
    container_name: django_app
    command: gunicorn ecommerce.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - .:/app
      - ./logs:/app/logs
    ports:
      - "8000:8000"
    env_file:
      - .env