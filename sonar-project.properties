# SonarQube configuration for Django Ecommerce

sonar.projectKey=django-ecommerce
sonar.organization=stormshadow47

# Source and test locations
sonar.sources=Users,Products,cart,orders,ecom_project
sonar.tests=Users,Products,cart,orders
sonar.test.inclusions=**/tests.py,**/unit_tests.py

# Exclusions
sonar.exclusions=**/migrations/**,**/static/**,**/media/**,**/__pycache__/**,**/asgi.py,**/wsgi.py,**/smoke_tests.py,**/.github/**,**/k8s/**,**/terraform/**,**/argocd/**,**/templates/**,**/jenkinsfile,**/dockerfile,**/docker-compose.yml

# Python configuration
sonar.python.version=3.12
sonar.sourceEncoding=UTF-8

# Coverage (generated in CI before SonarQube scan)
sonar.python.coverage.reportPaths=coverage.xml
sonar.coverage.exclusions=**/migrations/**,**/tests.py,**/unit_tests.py,**/asgi.py,**/wsgi.py

# Quality gate
sonar.qualitygate.wait=true
