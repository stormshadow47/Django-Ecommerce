# SonarQube configuration for Django Ecommerce

sonar.projectKey=django-ecommerce
sonar.organization=stormshadow47

# Source code location
sonar.sources=.
sonar.tests=.

# Exclusions
sonar.exclusions=**/migrations/**,**/static/**,**/media/**,**/venv/**,**/.git/**,**/node_modules/**,**/tests/**
sonar.test.inclusions=**/tests/**

# Python configuration
sonar.python.version=3.12
sonar.sourceEncoding=UTF-8

# Coverage configuration (if you have coverage reports)
# sonar.python.coverage.reportPaths=coverage.xml
# sonar.coverage.exclusions=**/migrations/**

# Quality gate
sonar.qualitygate.wait=true
