name: Build and Secure Container

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read
  packages: write # Required only on trusted pushes; PRs never publish images.
  security-events: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/django-ecommerce

jobs:
  security-gates:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      # A non-zero Semgrep result stops the job before any image is published.
      - name: Semgrep SAST gate
        run: |
          python -m pip install --disable-pip-version-check semgrep
          semgrep scan --config=p/security-audit --error .

      - name: Install Gitleaks
        run: |
          wget -q https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz
          tar -xzf gitleaks_8.24.3_linux_x64.tar.gz
          sudo mv gitleaks /usr/local/bin/
          gitleaks version

      - name: Run Gitleaks
        run: |
          gitleaks detect \
            --source . \
            --redact \
            --verbose \
            --exit-code 1

      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg lsb-release

          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | gpg --dearmor \
            | sudo tee /usr/share/keyrings/trivy.gpg >/dev/null

          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -cs) main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list

          sudo apt-get update
          sudo apt-get install -y trivy

      # Block vulnerable dependencies, exposed secrets, and misconfigured IaC.
      - name: Trivy filesystem security gate
        run: |
          trivy fs \
            --scanners vuln,secret,config \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            .

      - name: Run tests with coverage
        env:
          SECRET_KEY: ${{ secrets.CI_SECRET_KEY }}
          LOG_FILE: /tmp/django.log
        run: |
          pip install -r requirements.txt coverage
          coverage run --source='Users,Products,cart,orders,ecom_project' manage.py test \
            Users Products cart orders \
            Users.unit_tests Products.unit_tests cart.unit_tests orders.unit_tests
          coverage xml

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build locally first so Trivy can gate the image before publication.
      - name: Build Docker image locally
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./dockerfile
          load: true
          push: false
          tags: ghcr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}

      # A non-zero vulnerability result prevents registry publication and signing.
      - name: Trivy container image security gate
        run: |
          trivy image \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            ghcr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Publish scanned Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          docker push ghcr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker tag ghcr.io/${{ env.IMAGE_NAME }}:${{ github.sha }} ghcr.io/${{ env.IMAGE_NAME }}:latest
          docker push ghcr.io/${{ env.IMAGE_NAME }}:latest

      - name: Get published image digest
        id: image
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          digest="$(docker inspect --format='{{index .RepoDigests 0}}' ghcr.io/${{ env.IMAGE_NAME }}:${{ github.sha }})"
          echo "digest=${digest#*@}" >> "$GITHUB_OUTPUT"

      - name: Install Cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Sign Image
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          COSIGN_EXPERIMENTAL: "true"
        run: |
          cosign sign --yes \
            ghcr.io/${{ env.IMAGE_NAME }}@${{ steps.image.outputs.digest }}

      - name: Verify Signature
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          COSIGN_EXPERIMENTAL: "true"
        run: |
          cosign verify \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp "https://github.com/${{ github.repository }}/.github/workflows/.*" \
            ghcr.io/${{ env.IMAGE_NAME }}@${{ steps.image.outputs.digest }}
